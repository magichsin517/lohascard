name: Weekly Auto-Curate & LINE Broadcast

on:
  schedule:
    # 每週一 UTC 01:00 = 台北時間 09:00
    - cron: '0 1 * * 1'
  workflow_dispatch:
    # 手動觸發，方便測試

jobs:
  auto-curate:
    name: 自動選本週精選 + LINE 推播
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install supabase requests

      - name: Run auto_curate.py
        env:
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LINE_BROADCAST_SECRET:     ${{ secrets.LINE_BROADCAST_SECRET }}
        run: python scripts/curate/auto_curate.py
